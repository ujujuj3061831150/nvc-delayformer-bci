[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-fusion"
version = "1.0.0"
description = "Physiologically Constrained Temporal Fusion for Multimodal EEG-fNIRS Brain-Computer Interfaces"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Antigravity BCI Research Collaborative"}
]
keywords = ["EEG", "fNIRS", "BCI", "neurovascular-coupling", "cross-attention", "biomedical-computing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
]
